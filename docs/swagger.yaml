components:
  schemas:
    createapitoken.Input:
      properties:
        expires_in:
          description: ExpiresIn is how long the token works, 90d when left out.
          enum:
          - 7d
          - 30d
          - 90d
          - 1y
          - never
          type: string
        name:
          type: string
        read_only:
          description: ReadOnly makes a token that reads and changes nothing.
          type: boolean
      required:
      - name
      type: object
    createapitoken.Result:
      properties:
        api_token:
          $ref: '#/components/schemas/domain.Token'
        token:
          type: string
      required:
      - api_token
      - token
      type: object
    createsession.Input:
      properties:
        password:
          type: string
        token:
          description: 'Token asks the token in the answer too, for a client without
            cookies (the CLI): the web keeps it HttpOnly.'
          type: boolean
      required:
      - password
      type: object
    createsession.Result:
      properties:
        expires_at:
          type: string
        token:
          type: string
      required:
      - expires_at
      type: object
    deleteapplications.Input:
      properties:
        applied_after:
          example: "2026-01-01"
          type: string
        applied_before:
          description: 'AppliedBefore and AppliedAfter are strict: applied_at < before,
            applied_at > after.'
          example: "2026-01-31"
          type: string
        dry_run:
          description: 'DryRun deletes nothing: the result is what the call would
            delete.'
          type: boolean
        ids:
          description: IDs are the applications by id.
          items:
            type: string
          type: array
          uniqueItems: false
        q:
          description: Q is text found in the company, the address, website, source_detail
            or comment, case-insensitive.
          type: string
        source:
          example: job_post
          type: string
        status:
          description: Status is any of these statuses.
          items:
            $ref: '#/components/schemas/domain.Status'
          type: array
          uniqueItems: false
        summary:
          description: 'Summary leaves the ids out of the result: the counts and failures
            only.'
          type: boolean
        untouched_since:
          description: UntouchedSince is the applications not updated since this day.
          example: "2026-01-01"
          type: string
      type: object
    domain.Application:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        country:
          type: string
        created_at:
          type: string
        id:
          type: string
        location:
          description: Location is the city; Street, PostalCode and Country complete
            the address when known.
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        truncated:
          description: Truncated tells that comment was cut at max_chars.
          type: boolean
        updated_at:
          type: string
        website:
          description: Website is the company's site, or an e-mail to write to when
            it has none.
          type: string
      required:
      - id
      type: object
    domain.BatchFailure:
      properties:
        error:
          type: string
        id:
          type: string
        index:
          type: integer
        op:
          type: integer
      required:
      - error
      type: object
    domain.BatchResult:
      properties:
        count:
          type: integer
        dry_run:
          type: boolean
        failed:
          items:
            $ref: '#/components/schemas/domain.BatchFailure'
          type: array
          uniqueItems: false
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - count
      type: object
    domain.Changes:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        country:
          type: string
        location:
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        website:
          type: string
      type: object
    domain.NewApplication:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        country:
          type: string
        location:
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        website:
          type: string
      required:
      - company
      - location
      type: object
    domain.Status:
      enum:
      - applied
      - responded
      - interview
      - offer
      - rejected
      type: string
      x-enum-varnames:
      - StatusApplied
      - StatusResponded
      - StatusInterview
      - StatusOffer
      - StatusRejected
    domain.Token:
      properties:
        created_at:
          type: string
        expires_at:
          description: no limit when absent
          type: string
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.TokenKind'
        last_used_at:
          description: never used when absent
          type: string
        name:
          type: string
        read_only:
          type: boolean
      required:
      - created_at
      - id
      - kind
      - name
      - read_only
      type: object
    domain.TokenKind:
      enum:
      - session
      - api
      - oauth
      type: string
      x-enum-varnames:
      - TokenSession
      - TokenAPI
      - TokenOAuth
    listsources.Source:
      properties:
        count:
          type: integer
        source:
          type: string
      required:
      - count
      - source
      type: object
    login.MeResult:
      properties:
        kind:
          $ref: '#/components/schemas/domain.TokenKind'
        name:
          type: string
        read_only:
          type: boolean
        version:
          type: string
      required:
      - kind
      - read_only
      - version
      type: object
    readstats.Stats:
      properties:
        by_status:
          additionalProperties:
            type: integer
          description: ByStatus has every status, 0 included.
          type: object
        response_rate:
          description: ResponseRate is the share of applications that got past applied,
            0 to 1.
          type: number
        total:
          type: integer
      required:
      - by_status
      - response_rate
      - total
      type: object
    respond.Failure:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    updateapplications.Input:
      properties:
        dry_run:
          description: 'DryRun writes nothing: the result is what the call would write.'
          type: boolean
        ops:
          items:
            $ref: '#/components/schemas/updateapplications.Op'
          type: array
          uniqueItems: false
        summary:
          description: 'Summary leaves the ids out of the result: the counts and failures
            only.'
          type: boolean
      required:
      - ops
      type: object
    updateapplications.Op:
      properties:
        applied_after:
          example: "2026-01-01"
          type: string
        applied_before:
          description: 'AppliedBefore and AppliedAfter are strict: applied_at < before,
            applied_at > after.'
          example: "2026-01-31"
          type: string
        ids:
          description: IDs are the applications by id.
          items:
            type: string
          type: array
          uniqueItems: false
        q:
          description: Q is text found in the company, the address, website, source_detail
            or comment, case-insensitive.
          type: string
        set:
          $ref: '#/components/schemas/domain.Changes'
        source:
          example: job_post
          type: string
        status:
          description: Status is any of these statuses.
          items:
            $ref: '#/components/schemas/domain.Status'
          type: array
          uniqueItems: false
        untouched_since:
          description: UntouchedSince is the applications not updated since this day.
          example: "2026-01-01"
          type: string
      required:
      - set
      type: object
externalDocs:
  description: ""
  url: ""
info:
  title: callback API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/applications:
    delete:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Delete applications
      tags:
      - applications
    get:
      parameters:
      - description: Applications by id, comma separated or repeated
        in: query
        name: ids
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Any of these statuses
        in: query
        name: status
        schema:
          items:
            enum:
            - applied
            - responded
            - interview
            - offer
            - rejected
            type: string
          type: array
        style: form
      - description: 'Source: spontaneous, job_post, recruiter or a name given by
          the user'
        in: query
        name: source
        schema:
          type: string
      - description: Text in company, address, website, source or comment
        in: query
        name: q
        schema:
          type: string
      - description: applied_at < this day (2026-01-31)
        in: query
        name: applied_before
        schema:
          type: string
      - description: applied_at > this day (2026-01-31)
        in: query
        name: applied_after
        schema:
          type: string
      - description: Not updated since this day (2026-01-31)
        in: query
        name: untouched_since
        schema:
          type: string
      - description: Columns returned, all when empty; id always comes
        in: query
        name: fields
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 'Cut each comment to this many characters (truncated: true)'
        in: query
        name: max_chars
        schema:
          type: integer
      - description: applied_at, company, source, status, rating, created_at, updated_at;
          - first to reverse; -applied_at by default
        in: query
        name: sort
        schema:
          type: string
      - description: Most applications returned, all when 0
        in: query
        name: limit
        schema:
          type: integer
      - description: Applications skipped
        in: query
        name: offset
        schema:
          type: integer
      - description: No application, X-Total-Count only
        in: query
        name: count_only
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.Application'
                type: array
          description: OK
          headers:
            X-Total-Count:
              description: Count of all the applications that match
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: List applications
      tags:
      - applications
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Change applications
      tags:
      - applications
    post:
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/domain.NewApplication'
              title: body
              type: array
        description: At most 500 applications
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: 'None created: every item failed'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Create applications
      tags:
      - applications
  /api/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createsession.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createsession.Result'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Too Many Requests
      summary: Log in
      tags:
      - session
  /api/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: Log out
      tags:
      - session
  /api/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login.MeResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: Who is asking
      tags:
      - session
  /api/sources:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/listsources.Source'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: List the sources in use
      tags:
      - applications
  /api/stats:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/readstats.Stats'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: Count the applications
      tags:
      - applications
  /api/tokens:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.Token'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: List the tokens
      tags:
      - tokens
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createapitoken.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createapitoken.Result'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Create an API token
      tags:
      - tokens
  /api/tokens/{id}:
    delete:
      parameters:
      - description: Token id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
      summary: Revoke a token
      tags:
      - tokens
