components:
  schemas:
    createapitoken.Input:
      properties:
        expires_in:
          description: ExpiresIn is how long the token works, 90d when left out.
          enum:
          - 7d
          - 30d
          - 90d
          - 1y
          - never
          type: string
        name:
          type: string
        read_only:
          description: ReadOnly makes a token that reads and changes nothing.
          type: boolean
      required:
      - name
      type: object
    createapitoken.Result:
      properties:
        api_token:
          $ref: '#/components/schemas/domain.Token'
        token:
          type: string
      required:
      - api_token
      - token
      type: object
    createinvite.Result:
      properties:
        invite:
          $ref: '#/components/schemas/domain.Invite'
        token:
          type: string
      required:
      - invite
      - token
      type: object
    createsession.Input:
      properties:
        name:
          description: |-
            Name is the account's, any case: required in the multi mode, optional in the single one, where it must be the
            one account's.
          type: string
        password:
          type: string
        token:
          description: 'Token asks the token in the answer too, for a client without
            cookies (the CLI): the web keeps it HttpOnly.'
          type: boolean
      required:
      - password
      type: object
    createsession.Result:
      properties:
        expires_at:
          type: string
        token:
          type: string
      required:
      - expires_at
      type: object
    createuser.Input:
      properties:
        invite:
          type: string
        name:
          type: string
        password:
          type: string
      required:
      - name
      - password
      type: object
    deleteapplications.Input:
      properties:
        applied_after:
          example: "2026-01-01"
          type: string
        applied_before:
          description: 'AppliedBefore and AppliedAfter are strict: applied_at < before,
            applied_at > after.'
          example: "2026-01-31"
          type: string
        dry_run:
          description: 'DryRun deletes nothing: the result is what the call would
            delete.'
          type: boolean
        ids:
          description: IDs are the applications by id.
          items:
            type: string
          type: array
          uniqueItems: false
        location:
          description: Location is this city, whatever the case.
          example: Lyon
          type: string
        q:
          description: Q is text found in the company, the address, website, source_detail,
            contact or comment, case-insensitive.
          type: string
        source:
          example: job_post
          type: string
        status:
          description: Status is any of these statuses.
          items:
            $ref: '#/components/schemas/domain.Status'
          type: array
          uniqueItems: false
        summary:
          description: 'Summary leaves the ids out of the result: the counts and failures
            only.'
          type: boolean
        untouched_since:
          description: 'UntouchedSince is the applications without news since this
            day: no status change, follow-up nor interview.'
          example: "2026-01-01"
          type: string
      type: object
    domain.Application:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        contact_email:
          type: string
        contact_name:
          type: string
        country:
          type: string
        created_at:
          type: string
        followed_up_at:
          description: FollowedUpAt is the last follow-up, set by an update with followed_up.
          type: string
        id:
          type: string
        interview_at:
          description: InterviewAt is the next interview's local date and time.
          example: 2026-01-31T14:30
          type: string
        location:
          description: Location is the city; Street, PostalCode and Country complete
            the address when known.
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        truncated:
          description: Truncated tells that comment was cut at max_chars.
          type: boolean
        updated_at:
          type: string
        website:
          description: Website is the company's site, or an e-mail to write to when
            it has none.
          type: string
      required:
      - id
      type: object
    domain.Backup:
      properties:
        applications:
          items:
            $ref: '#/components/schemas/domain.Application'
          type: array
          uniqueItems: false
        deleted:
          items:
            $ref: '#/components/schemas/domain.DeletedApplication'
          type: array
          uniqueItems: false
        exported_at:
          type: string
        follow_ups:
          items:
            $ref: '#/components/schemas/domain.FollowUp'
          type: array
          uniqueItems: false
        status_changes:
          items:
            $ref: '#/components/schemas/domain.StatusChange'
          type: array
          uniqueItems: false
        version:
          example: 1
          type: integer
      required:
      - applications
      - deleted
      - exported_at
      - follow_ups
      - status_changes
      - version
      type: object
    domain.BatchFailure:
      properties:
        error:
          type: string
        id:
          type: string
        index:
          type: integer
        op:
          type: integer
      required:
      - error
      type: object
    domain.BatchResult:
      properties:
        count:
          type: integer
        dry_run:
          type: boolean
        failed:
          items:
            $ref: '#/components/schemas/domain.BatchFailure'
          type: array
          uniqueItems: false
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - count
      type: object
    domain.Changes:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        contact_email:
          type: string
        contact_name:
          type: string
        country:
          type: string
        followed_up:
          description: 'FollowedUp records a follow-up now: followed_up_at becomes
            now, and the status counts as news again.'
          type: boolean
        interview_at:
          description: InterviewAt, ContactName and ContactEmail are cleared by "".
          example: 2026-01-31T14:30
          type: string
        location:
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        undo_follow_up:
          description: 'UndoFollowUp forgets the last follow-up: followed_up_at goes
            back to the one before, if any.'
          type: boolean
        undo_status:
          description: |-
            UndoStatus takes the status back to the one before its last change and forgets that change: a status set by
            mistake leaves no step in the history.
          type: boolean
        website:
          type: string
      type: object
    domain.Country:
      properties:
        code:
          example: IT
          type: string
        key:
          example: countries.IT
          type: string
        name:
          example: Italy
          type: string
      required:
      - code
      - key
      - name
      type: object
    domain.DeletedApplication:
      properties:
        application:
          $ref: '#/components/schemas/domain.Application'
          description: 'Application is the row as it was, in JSON: a column the applications
            gain needs nothing here.'
        deleted_at:
          type: string
        id:
          type: string
      required:
      - application
      - deleted_at
      - id
      type: object
    domain.FollowUp:
      properties:
        application_id:
          type: string
        at:
          type: string
      required:
      - application_id
      - at
      type: object
    domain.Invite:
      properties:
        created_at:
          type: string
        created_by:
          description: the admin who made it
          type: string
        expires_at:
          type: string
        id:
          type: string
      required:
      - created_at
      - created_by
      - expires_at
      - id
      type: object
    domain.NewApplication:
      properties:
        applied_at:
          example: "2026-01-31"
          type: string
        comment:
          type: string
        company:
          type: string
        contact_email:
          type: string
        contact_name:
          type: string
        country:
          type: string
        interview_at:
          example: 2026-01-31T14:30
          type: string
        location:
          type: string
        postal_code:
          type: string
        rating:
          type: integer
        source:
          example: job_post
          type: string
        source_detail:
          type: string
        status:
          $ref: '#/components/schemas/domain.Status'
        street:
          type: string
        website:
          type: string
      required:
      - company
      - location
      type: object
    domain.PreferenceChanges:
      properties:
        default_country:
          type: string
        default_location:
          type: string
        follow_up_days:
          type: integer
        no_reply_days:
          type: integer
        plan:
          enum:
          - base
          - pro
          type: string
        trash_days:
          type: integer
      type: object
    domain.Preferences:
      properties:
        default_country:
          type: string
        default_location:
          description: DefaultLocation and DefaultCountry (a code of Countries) fill
            a new application of the web app; both may be empty.
          type: string
        follow_up_days:
          description: FollowUpDays is how long an application waits without news
            before it is to follow up.
          type: integer
        no_reply_days:
          description: |-
            NoReplyDays is how long a waiting application stays without news (since its last follow-up, status change or
            interview, else the day it applied) before the server moves it to no_reply; 0 never does.
          type: integer
        plan:
          enum:
          - base
          - pro
          type: string
        trash_days:
          description: TrashDays is how long a deleted application can be restored,
            before it is gone with its history.
          type: integer
      required:
      - default_country
      - default_location
      - follow_up_days
      - no_reply_days
      - plan
      - trash_days
      type: object
    domain.ServerMode:
      properties:
        add_user_mode:
          enum:
          - invitation
          - public
          type: string
        mode:
          enum:
          - single
          - multi
          type: string
      required:
      - add_user_mode
      - mode
      type: object
    domain.Status:
      enum:
      - applied
      - responded
      - interview
      - offer
      - rejected
      - no_reply
      type: string
      x-enum-varnames:
      - StatusApplied
      - StatusResponded
      - StatusInterview
      - StatusOffer
      - StatusRejected
      - StatusNoReply
    domain.StatusChange:
      properties:
        application_id:
          type: string
        at:
          type: string
        company:
          description: Company is read from the application, to tell the changes apart
            without reading the applications.
          type: string
        from:
          $ref: '#/components/schemas/domain.Status'
          description: From is the status before the change, empty when the application
            was created with Status.
        status:
          $ref: '#/components/schemas/domain.Status'
      required:
      - application_id
      - at
      - from
      - status
      type: object
    domain.Token:
      properties:
        created_at:
          type: string
        expires_at:
          description: no limit when absent
          type: string
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.TokenKind'
        last_used_at:
          description: never used when absent
          type: string
        name:
          type: string
        read_only:
          type: boolean
      required:
      - created_at
      - id
      - kind
      - name
      - read_only
      type: object
    domain.TokenKind:
      enum:
      - session
      - api
      - oauth
      type: string
      x-enum-varnames:
      - TokenSession
      - TokenAPI
      - TokenOAuth
    domain.User:
      properties:
        admin:
          type: boolean
        created_at:
          type: string
        id:
          type: string
        name:
          description: unique case-insensitive, see createschema
          type: string
        preferences:
          $ref: '#/components/schemas/domain.Preferences'
          description: |-
            Preferences are stored as JSON: readpreferences reads them over DefaultPreferences, so a preference added since
            keeps its default. A pointer, so an insert without them writes the default {}, not zeros.
      required:
      - admin
      - created_at
      - id
      - name
      type: object
    forgetapplications.Input:
      properties:
        all:
          description: All empties the trash; without it, ids are required.
          type: boolean
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    importdata.Result:
      properties:
        added:
          type: integer
        deleted:
          type: integer
        failed:
          items:
            $ref: '#/components/schemas/domain.BatchFailure'
          type: array
          uniqueItems: false
        skipped:
          type: integer
      required:
      - added
      - deleted
      - skipped
      type: object
    listsources.Source:
      properties:
        count:
          type: integer
        source:
          type: string
      required:
      - count
      - source
      type: object
    login.MeResult:
      properties:
        admin:
          description: the account manages the others, in the multi mode
          type: boolean
        kind:
          $ref: '#/components/schemas/domain.TokenKind'
        mode:
          enum:
          - single
          - multi
          type: string
        name:
          description: the token's, for an API token or an OAuth connection
          type: string
        read_only:
          type: boolean
        user:
          description: the account's name
          type: string
        version:
          type: string
      required:
      - admin
      - kind
      - mode
      - read_only
      - user
      - version
      type: object
    purgeapplications.Result:
      properties:
        count:
          type: integer
      required:
      - count
      type: object
    readstats.Stats:
      properties:
        by_source:
          additionalProperties:
            type: integer
          description: 'BySource has the sources in use: an agent reuses their names
            rather than make a near double.'
          type: object
        by_status:
          additionalProperties:
            type: integer
          description: ByStatus has every status, 0 included.
          type: object
        response_rate:
          description: ResponseRate is the share of applications that got past applied,
            0 to 1; left out without applications.
          type: number
        response_rate_by_source:
          additionalProperties:
            type: number
          description: ResponseRateBySource is ResponseRate for each source of BySource.
          type: object
        total:
          type: integer
      required:
      - by_source
      - by_status
      - response_rate_by_source
      - total
      type: object
    respond.Failure:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    restoreapplications.Input:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    updateapplications.Input:
      properties:
        dry_run:
          description: 'DryRun writes nothing: the result is what the call would write.'
          type: boolean
        ops:
          items:
            $ref: '#/components/schemas/updateapplications.Op'
          type: array
          uniqueItems: false
        summary:
          description: 'Summary leaves the ids out of the result: the counts and failures
            only.'
          type: boolean
      required:
      - ops
      type: object
    updateapplications.Op:
      properties:
        applied_after:
          example: "2026-01-01"
          type: string
        applied_before:
          description: 'AppliedBefore and AppliedAfter are strict: applied_at < before,
            applied_at > after.'
          example: "2026-01-31"
          type: string
        ids:
          description: IDs are the applications by id.
          items:
            type: string
          type: array
          uniqueItems: false
        location:
          description: Location is this city, whatever the case.
          example: Lyon
          type: string
        q:
          description: Q is text found in the company, the address, website, source_detail,
            contact or comment, case-insensitive.
          type: string
        set:
          $ref: '#/components/schemas/domain.Changes'
        source:
          example: job_post
          type: string
        status:
          description: Status is any of these statuses.
          items:
            $ref: '#/components/schemas/domain.Status'
          type: array
          uniqueItems: false
        untouched_since:
          description: 'UntouchedSince is the applications without news since this
            day: no status change, follow-up nor interview.'
          example: "2026-01-01"
          type: string
      required:
      - set
      type: object
    users.Reset:
      properties:
        password:
          type: string
      required:
      - password
      type: object
externalDocs:
  description: ""
  url: ""
info:
  title: callback API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/add-user:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ServerMode'
          description: OK
      summary: 'How the server runs: its mode and how accounts are created'
      tags:
      - users
  /api/applications:
    delete:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Delete applications
      tags:
      - applications
    get:
      parameters:
      - description: Applications by id, comma separated or repeated
        in: query
        name: ids
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Any of these statuses
        in: query
        name: status
        schema:
          items:
            enum:
            - applied
            - responded
            - interview
            - offer
            - rejected
            - no_reply
            type: string
          type: array
        style: form
      - description: 'Source: spontaneous, job_post, recruiter or a name given by
          the user'
        in: query
        name: source
        schema:
          type: string
      - description: This city, whatever the case
        in: query
        name: location
        schema:
          type: string
      - description: Text in company, address, website, source, contact or comment
        in: query
        name: q
        schema:
          type: string
      - description: applied_at < this day (2026-01-31)
        in: query
        name: applied_before
        schema:
          type: string
      - description: applied_at > this day (2026-01-31)
        in: query
        name: applied_after
        schema:
          type: string
      - description: Not updated since this day (2026-01-31)
        in: query
        name: untouched_since
        schema:
          type: string
      - description: Columns returned, all when empty; id always comes
        in: query
        name: fields
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 'Cut each comment to this many characters (truncated: true)'
        in: query
        name: max_chars
        schema:
          type: integer
      - description: applied_at, company, location, source, status, rating, followed_up_at,
          created_at, updated_at; - first to reverse; -applied_at by default
        in: query
        name: sort
        schema:
          type: string
      - description: Most applications returned, all when 0
        in: query
        name: limit
        schema:
          type: integer
      - description: Applications skipped
        in: query
        name: offset
        schema:
          type: integer
      - description: No application, X-Total-Count only
        in: query
        name: count_only
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.Application'
                type: array
          description: OK
          headers:
            X-Total-Count:
              description: Count of all the applications that match
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: List applications
      tags:
      - applications
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Change applications
      tags:
      - applications
    post:
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/domain.NewApplication'
              title: body
              type: array
        description: At most 500 applications
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: 'None created: every item failed'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Create applications
      tags:
      - applications
  /api/applications/deleted:
    delete:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/forgetapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Delete applications from the trash for good
      tags:
      - applications
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.DeletedApplication'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: List deleted applications
      tags:
      - applications
  /api/applications/restore:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/restoreapplications.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.BatchResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Forbidden
      summary: Restore deleted applications
