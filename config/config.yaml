name: "callback"
commands:
  server-root:
    use: "{name}-server"
    short: "The job application tracker's server: its API, web app and MCP over HTTP"
  serve:
    use: "serve"
    short: "Serve the API"
    long: "Serve the API on --addr, the web app of --web next to it, and the MCP over HTTP with its OAuth on --mcp-addr. On an empty base, {NAME}_PASSWORD sets the password."
    example: "{NAME}_PASSWORD=change-me {name}-server serve --db ./data/{name}.db --web ./web/.output/public"
    args:
      - name: "addr"
        shorthand: ""
        value: ":8080"
        usage: "Address of the API"
        type: "string"
      - name: "origin"
        shorthand: ""
        value: ""
        usage: "Origin of the web app when it runs apart (http://localhost:3000), none when it is served by --web"
        type: "string"
      - name: "web"
        shorthand: ""
        value: ""
        usage: "Folder of the generated web app to serve next to the API"
        type: "string"
      - name: "published"
        shorthand: ""
        value: ""
        usage: "Address the API is reachable at, --addr when empty: on the loopback, X-Forwarded-For is trusted"
        type: "string"
      - name: "mcp-addr"
        shorthand: ""
        value: ""
        usage: "Address of the MCP over HTTP and its OAuth, none when empty"
        type: "string"
      - name: "mcp-published"
        shorthand: ""
        value: ""
        usage: "Address the MCP is reachable at, --mcp-addr when empty: on the loopback, X-Forwarded-For is trusted"
        type: "string"
  reset-password:
    use: "reset-password"
    short: "Change the password"
    long: "Change the password, read from {NAME}_PASSWORD or asked on the terminal. Every session and token stays valid but the sessions: they log out."
    example: "{NAME}_PASSWORD=new-one {name}-server reset-password"
  backup:
    use: "backup <file>"
    short: "Copy the base to a file"
    long: "Copy the base to a file with VACUUM INTO, while the server runs. The file must not exist."
    example: "{name}-server backup /data/backup-$(date +%F).db"
  root:
    use: "{name}"
    short: "Track job applications from the terminal: a client of the {name}-server API"
    long: "Every command talks to the server logged in with `{name} login <url>`, or to {NAME}_URL with the token of {NAME}_SESSION. Every command takes --json for scripts."
  login:
    use: "login <url>"
    short: "Log in to a server"
    long: "Log in to the server at <url> with its password, read from {NAME}_PASSWORD or asked on the terminal. The session is kept in ~/.config/{name}/session.json."
    example: "{name} login https://callback.example.com"
  logout:
    use: "logout"
    short: "Log out of the server"
  whoami:
    use: "whoami"
    short: "Show the server and the token in use"
    args:
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  add:
    use: "add"
    short: "Add applications"
    long: "Add one application from the flags, or a batch from --file: a JSON array of {company, location, street, postal_code, country, website, source, source_detail, status, rating, comment, applied_at, interview_at, contact_name, contact_email}. Prints the ids created; the items that failed go to stderr and the exit code is not 0."
    example: "{name} add --company Acme --location Paris --country France --source job_post --source-detail https://acme.example/jobs/1\n{name} add --file apps.json\ncat apps.json | {name} add --file -"
    args:
      - name: "company"
        type: "string"
        usage: "Company"
      - name: "location"
        type: "string"
        usage: "Location, the city"
      - name: "street"
        type: "string"
        usage: "Street"
      - name: "postal-code"
        type: "string"
        usage: "Postal code"
      - name: "country"
        type: "string"
        usage: "Country"
      - name: "website"
        type: "string"
        usage: "Website, an http(s) URL, or an e-mail"
      - name: "source"
        type: "string"
        usage: "spontaneous (default), job_post, recruiter or any name (60 characters at most)"
      - name: "source-detail"
        type: "string"
        usage: "The job post's URL for job_post, the recruiter's e-mail for recruiter, free text for another source"
      - name: "status"
        type: "string"
        usage: "applied (default), responded, interview, offer or rejected"
      - name: "rating"
        type: "int"
        usage: "Rating, 0 to 5"
      - name: "comment"
        type: "string"
        usage: "Comment"
      - name: "applied-at"
        type: "string"
        usage: "Day of the application, 2026-01-31; today by default"
      - name: "interview-at"
        type: "string"
        usage: "Local date and time of the interview, 2026-01-31T14:30"
      - name: "contact-name"
        type: "string"
        usage: "Name of the contact"
      - name: "contact-email"
        type: "string"
        usage: "E-mail of the contact"
      - name: "file"
        type: "string"
        usage: "JSON array of applications to add, - for stdin"
      - name: "json"
        type: "bool"
        usage: "Print the result as JSON"
  ls:
    use: "ls"
    short: "List applications"
    long: "List the applications that match every filter given, newest first, as a table of id, company, status and applied_at (--fields for others)."
    example: "{name} ls --status applied,responded --untouched-since 2026-01-01\n{name} ls -q acme --fields company,comment --max-chars 40\n{name} ls --status interview --count"
    args:
      - name: "status"
        type: "stringSlice"
        usage: "Any of these statuses, comma separated or repeated"
      - name: "source"
        type: "string"
        usage: "spontaneous, job_post, recruiter or any name"
      - name: "query"
        shorthand: "q"
        type: "string"
        usage: "Text in the company, address, website, source_detail, contact or comment"
      - name: "applied-before"
        type: "string"
        usage: "Applied before this day, 2026-01-31"
      - name: "applied-after"
        type: "string"
        usage: "Applied after this day, 2026-01-31"
      - name: "untouched-since"
        type: "string"
        usage: "Not updated since this day, 2026-01-31"
      - name: "fields"
        type: "stringSlice"
        usage: "Columns: company, location, street, postal_code, country, website, source, source_detail, status, rating, comment, applied_at, interview_at, contact_name, contact_email, created_at, updated_at"
      - name: "max-chars"
        type: "int"
        usage: "Cut each comment to this many characters"
      - name: "sort"
        type: "string"
        usage: "applied_at, company, source, status, rating, created_at or updated_at; - first to reverse; -applied_at by default"
      - name: "limit"
        type: "int"
        usage: "Most applications listed, all when 0"
      - name: "offset"
        type: "int"
        usage: "Applications skipped"
      - name: "count"
        type: "bool"
        usage: "Print the count only"
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  show:
    use: "show <id>..."
    short: "Show applications whole"
    example: "{name} show 0193… 0194…"
    args:
      - name: "max-chars"
        type: "int"
        usage: "Cut each comment to this many characters"
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  edit:
    use: "edit [<id>...]"
    short: "Change applications"
    long: "Change the applications of the ids, or of the --where-status, --where-source, -q, --applied-before, --applied-after and --untouched-since filters, in one batch: the other flags are the fields set. --dry-run first shows what would change."
    example: "{name} edit 0193… --status interview --rating 4\n{name} edit --where-status applied --untouched-since 2026-01-01 --status rejected --dry-run"
    args:
      - name: "where-status"
        type: "stringSlice"
        usage: "Filter: any of these statuses, comma separated or repeated"
      - name: "where-source"
        type: "string"
        usage: "Filter: spontaneous, job_post or recruiter"
      - name: "query"
        shorthand: "q"
        type: "string"
        usage: "Filter: text in the company, address, website, source_detail, contact or comment"
      - name: "applied-before"
        type: "string"
        usage: "Filter: applied before this day, 2026-01-31"
      - name: "applied-after"
        type: "string"
        usage: "Filter: applied after this day, 2026-01-31"
      - name: "untouched-since"
        type: "string"
        usage: "Filter: not updated since this day, 2026-01-31"
      - name: "company"
        type: "string"
        usage: "Set the company"
      - name: "location"
        type: "string"
        usage: "Set the location, the city"
      - name: "street"
        type: "string"
        usage: "Set the street"
      - name: "postal-code"
        type: "string"
        usage: "Set the postal code"
      - name: "country"
        type: "string"
        usage: "Set the country"
      - name: "website"
        type: "string"
        usage: "Set the website, an http(s) URL or an e-mail"
      - name: "source"
        type: "string"
        usage: "Set the source: spontaneous, job_post, recruiter or any name"
      - name: "source-detail"
        type: "string"
        usage: "Set the source detail"
      - name: "status"
        type: "string"
        usage: "Set the status"
      - name: "rating"
        type: "int"
        usage: "Set the rating, 0 to 5"
      - name: "comment"
        type: "string"
        usage: "Set the comment"
      - name: "applied-at"
        type: "string"
        usage: "Set the day of the application"
      - name: "interview-at"
        type: "string"
        usage: "Set the interview's local date and time, 2026-01-31T14:30; \"\" clears it"
      - name: "contact-name"
        type: "string"
        usage: "Set the contact's name"
      - name: "contact-email"
        type: "string"
        usage: "Set the contact's e-mail"
      - name: "dry-run"
        type: "bool"
        usage: "Change nothing, show what would change"
      - name: "json"
        type: "bool"
        usage: "Print the result as JSON"
  rm:
    use: "rm [<id>...]"
    short: "Delete applications"
    long: "Delete for good the applications of the ids, or of the filters, in one batch. --dry-run first shows what would go."
    example: "{name} rm 0193…\n{name} rm --status rejected --applied-before 2025-01-01 --dry-run"
    args:
      - name: "status"
        type: "stringSlice"
        usage: "Any of these statuses, comma separated or repeated"
      - name: "source"
        type: "string"
        usage: "spontaneous, job_post, recruiter or any name"
      - name: "query"
        shorthand: "q"
        type: "string"
        usage: "Text in the company, address, website, source_detail, contact or comment"
      - name: "applied-before"
        type: "string"
        usage: "Applied before this day, 2026-01-31"
      - name: "applied-after"
        type: "string"
        usage: "Applied after this day, 2026-01-31"
      - name: "untouched-since"
        type: "string"
        usage: "Not updated since this day, 2026-01-31"
      - name: "dry-run"
        type: "bool"
        usage: "Delete nothing, show what would go"
      - name: "json"
        type: "bool"
        usage: "Print the result as JSON"
  stats:
    use: "stats"
    short: "Count the applications per status, with the response rate"
    args:
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  token:
    use: "token"
    short: "Manage the API tokens of scripts and agents"
  token-add:
    use: "add <name>"
    short: "Create an API token"
    long: "Create an API token and print it: it is shown once. Scripts send it as Authorization: Bearer, agents as {NAME}_SESSION or to the MCP over HTTP."
    example: "{name} token add claude --read-only --expires 30d"
    args:
      - name: "read-only"
        type: "bool"
        usage: "The token reads and changes nothing"
      - name: "expires"
        type: "string"
        value: "90d"
        usage: "7d, 30d, 90d, 1y or never"
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  token-ls:
    use: "ls"
    short: "List the tokens"
    args:
      - name: "json"
        type: "bool"
        usage: "Print JSON"
  token-rm:
    use: "rm <id>"
    short: "Revoke a token"
  mcp:
    use: "mcp"
    short: "Serve the applications to an agent over MCP, on stdin and stdout"
    long: "Serve the MCP tools on stdin and stdout, acting with the session of `{name} login` or {NAME}_URL and {NAME}_SESSION; a read-only token gets the reading tools only."
    example: "claude mcp add callback -- {name} mcp"
