name: "jat"
commands:
  server-root:
    use: "{name}-server"
    short: "The job application tracker's server: its API, web app and MCP over HTTP"
  serve:
    use: "serve"
    short: "Serve the API"
    long: "Serve the API on --addr, the web app of --web next to it, and the MCP over HTTP with its OAuth on --mcp-addr. On an empty base, {NAME}_PASSWORD sets the password."
    example: "{NAME}_PASSWORD=change-me {name}-server serve --db ./data/{name}.db --web ./web/.output/public"
    args:
      - name: "addr"
        shorthand: ""
        value: ":8080"
        usage: "Address of the API"
        type: "string"
      - name: "origin"
        shorthand: ""
        value: ""
        usage: "Origin of the web app when it runs apart (http://localhost:3000), none when it is served by --web"
        type: "string"
      - name: "web"
        shorthand: ""
        value: ""
        usage: "Folder of the generated web app to serve next to the API"
        type: "string"
      - name: "published"
        shorthand: ""
        value: ""
        usage: "Address the API is reachable at, --addr when empty: on the loopback, X-Forwarded-For is trusted"
        type: "string"
      - name: "mcp-addr"
        shorthand: ""
        value: ""
        usage: "Address of the MCP over HTTP and its OAuth, none when empty"
        type: "string"
      - name: "mcp-published"
        shorthand: ""
        value: ""
        usage: "Address the MCP is reachable at, --mcp-addr when empty: on the loopback, X-Forwarded-For is trusted"
        type: "string"
  reset-password:
    use: "reset-password"
    short: "Change the password"
    long: "Change the password, read from {NAME}_PASSWORD or asked on the terminal. Every session and token stays valid but the sessions: they log out."
    example: "{NAME}_PASSWORD=new-one {name}-server reset-password"
  backup:
    use: "backup <file>"
    short: "Copy the base to a file"
    long: "Copy the base to a file with VACUUM INTO, while the server runs. The file must not exist."
    example: "{name}-server backup /data/backup-$(date +%F).db"
