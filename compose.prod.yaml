# `docker compose -f compose.prod.yaml up -d`, with a .env next to it (see .env.example).
# Update: `docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d`.
#
# Exposure: both ports are published on 127.0.0.1 only. The API and the web app (8080) stay private on the tailnet
# (`tailscale serve` in front of 8080). Only /mcp (8081) is opened to the Internet: `tailscale funnel` on the MCP
# port, or a Cloudflare tunnel to 127.0.0.1:8081.
services:
  callback:
    # The name image.yml publishes, ghcr.io/<the GitHub repository>. CALLBACK_IMAGE overrides it (the CI uses a local tag).
    image: ${CALLBACK_IMAGE:-ghcr.io/cyril-fl/callback:latest}
    container_name: callback
    environment:
      CALLBACK_PASSWORD: ${CALLBACK_PASSWORD:-}
      CALLBACK_USER: ${CALLBACK_USER:-}
    # --origin: the address the browser types, requests from any other page are refused. --published: the address
    # published on the host, so the server knows it sits behind a proxy on loopback.
    command: >-
      serve --db /data/callback.db --web /web --addr :8080
      --origin ${CALLBACK_ORIGIN:?set CALLBACK_ORIGIN in .env}
      --published ${CALLBACK_LISTEN:-127.0.0.1:8080}
      --mcp-addr :8081 --mcp-published ${CALLBACK_MCP_LISTEN:-127.0.0.1:8081}
    ports:
      - "${CALLBACK_LISTEN:-127.0.0.1:8080}:8080"
      - "${CALLBACK_MCP_LISTEN:-127.0.0.1:8081}:8081"
    volumes:
      - callback-data:/data
    restart: unless-stopped

volumes:
  callback-data:
