# The dev stack: `make up`, the image built locally. API and web on 8080, MCP on 8081.
# Never put a tunnel in front of it: without --published, every client behind a proxy shares one address for the
# wrong-password delay, so one stranger could lock you out. compose.prod.yaml is the one to expose.
name: callback

services:
  callback:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: callback
    environment:
      CALLBACK_PASSWORD: ${CALLBACK_PASSWORD:?set CALLBACK_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    command: serve --db /data/callback.db --web /web --addr :8080 --mcp-addr :8081
    volumes:
      - callback-data:/data
    restart: unless-stopped

  # Optional: `docker compose --profile postgres up -d postgres`, then --db
  # postgres://callback:callback@postgres:5432/callback?sslmode=disable (localhost from the host).
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: callback
      POSTGRES_PASSWORD: callback
      POSTGRES_DB: callback
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  callback-data:
  postgres-data:
